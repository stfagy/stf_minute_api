services:
  - type: web
    name: mudm-api            # change le nom si déjà utilisé
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL     # à lier dans l'UI Render (Internal Connection String)
        sync: false
      - key: POOL_MIN
        value: "1"
      - key: POOL_MAX
        value: "5"
